name: Test blocks with mrkdwn and thread_ts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start fake Slack webhook
        run: |
          rm -rf /tmp/slack-mock
          nohup node "$GITHUB_WORKSPACE/tests/fixtures/mock-slack.js" > /tmp/slack-mock.log 2>&1 &
          for i in $(seq 1 50); do [ -f /tmp/slack-mock/ready ] && break; sleep 0.2; done
          [ -f /tmp/slack-mock/ready ] || { echo "FAIL: mock did not start"; cat /tmp/slack-mock.log; exit 1; }
      - id: action
        uses: .
        env:
          INCOMING_WEBHOOK_URL: http://127.0.0.1:18080/ok
        with:
          text: Fallback text
          mrkdwn: false
          thread_ts: "1234567890.123456"
          blocks: |
            [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Bold* block text"
                }
              },
              { "type": "divider" }
            ]
      - name: Assert response output
        env:
          ACTUAL: ${{ steps.action.outputs.response }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "OK" ]; then
            echo "FAIL: expected 'OK'"
            exit 1
          fi
          echo "PASS"
      - name: Assert posted payload
        run: |
          cat /tmp/slack-mock/last.json; echo
          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("/tmp/slack-mock/last.json", "utf8"));
            const fail = (m) => { console.log("FAIL: " + m); process.exit(1); };
            if (body.text !== "Fallback text") fail("text " + JSON.stringify(body.text));
            if (body.mrkdwn !== false) fail("mrkdwn should be boolean false, got " + JSON.stringify(body.mrkdwn));
            if (String(body.thread_ts) !== "1234567890.123456" && body.thread_ts !== 1234567890.123456) fail("thread_ts " + JSON.stringify(body.thread_ts));
            if (!Array.isArray(body.blocks)) fail("blocks should be an array");
            if (body.blocks.length !== 2) fail("expected 2 blocks, got " + body.blocks.length);
            if (body.blocks[0].type !== "section") fail("first block type " + body.blocks[0].type);
            if (body.blocks[0].text.text !== "*Bold* block text") fail("block text " + body.blocks[0].text.text);
            if (body.blocks[1].type !== "divider") fail("second block type " + body.blocks[1].type);
            console.log("PASS");
          '
