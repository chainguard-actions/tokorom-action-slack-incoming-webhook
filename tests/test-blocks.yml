name: Test blocks message
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local webhook receiver
        run: |
          rm -rf /tmp/webhook
          WEBHOOK_DIR=/tmp/webhook WEBHOOK_PORT=18080 nohup node "$GITHUB_WORKSPACE/tests/fixtures/webhook-server.js" > /tmp/webhook-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/ >/dev/null; then echo "server ready"; exit 0; fi
            sleep 1
          done
          cat /tmp/webhook-server.log
          echo "FAIL: webhook server did not start"
          exit 1
      - id: action
        uses: .
        env:
          INCOMING_WEBHOOK_URL: http://127.0.0.1:18080/hook
        with:
          text: Fallback text
          blocks: |
            [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Bold* block text"
                }
              },
              {
                "type": "divider"
              }
            ]
      - name: Assert response output
        env:
          ACTUAL: ${{ steps.action.outputs.response }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "OK" ]; then
            echo "FAIL: expected 'OK'"
            exit 1
          fi
          echo "PASS"
      - name: Assert blocks parsed as JSON array
        run: |
          cat /tmp/webhook/last.json; echo
          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("/tmp/webhook/last.json", "utf8"));
            const fail = (m) => { console.log("FAIL: " + m); process.exit(1); };
            if (body.text !== "Fallback text") fail("unexpected text " + JSON.stringify(body.text));
            if (!Array.isArray(body.blocks)) fail("blocks is not an array: " + JSON.stringify(body.blocks));
            if (body.blocks.length !== 2) fail("expected 2 blocks, got " + body.blocks.length);
            if (body.blocks[0].type !== "section") fail("first block type " + body.blocks[0].type);
            if (body.blocks[0].text.text !== "*Bold* block text") fail("first block text " + body.blocks[0].text.text);
            if (body.blocks[1].type !== "divider") fail("second block type " + body.blocks[1].type);
            console.log("PASS");
          '
