name: Test webhook HTTP error fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local webhook receiver
        run: |
          export PORT=18084 RECEIVED_FILE=/tmp/slack-error.jsonl
          nohup node "$GITHUB_WORKSPACE/tests/fixtures/mock-slack-server.js" > /tmp/mock-error.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18084/health >/dev/null; then echo "server up"; exit 0; fi
            sleep 1
          done
          cat /tmp/mock-error.log
          echo "FAIL: mock server did not start"
          exit 1
      - id: action
        uses: .
        continue-on-error: true
        env:
          INCOMING_WEBHOOK_URL: http://127.0.0.1:18084/fail
        with:
          text: this will get a 500
      - name: Assert action failed and request was made
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "response: $RESPONSE"
          cat /tmp/slack-error.jsonl
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on HTTP 500"
            exit 1
          fi
          if [ -n "$RESPONSE" ]; then
            echo "FAIL: response output should be empty"
            exit 1
          fi
          if ! grep -q '"/fail"' /tmp/slack-error.jsonl; then
            echo "FAIL: action did not POST to the webhook"
            exit 1
          fi
          echo "PASS"
