name: Test webhook HTTP error fails the step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start fake Slack webhook
        run: |
          rm -rf /tmp/slack-mock
          nohup node "$GITHUB_WORKSPACE/tests/fixtures/mock-slack.js" > /tmp/slack-mock.log 2>&1 &
          for i in $(seq 1 50); do [ -f /tmp/slack-mock/ready ] && break; sleep 0.2; done
          [ -f /tmp/slack-mock/ready ] || { echo "FAIL: mock did not start"; cat /tmp/slack-mock.log; exit 1; }
      - id: action
        uses: .
        continue-on-error: true
        env:
          INCOMING_WEBHOOK_URL: http://127.0.0.1:18080/fail
        with:
          text: this will be rejected
      - name: Assert action failed after posting
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "response: $RESPONSE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on HTTP 500"
            exit 1
          fi
          if [ ! -f /tmp/slack-mock/last.json ]; then
            echo "FAIL: request never reached the webhook"
            exit 1
          fi
          cat /tmp/slack-mock/last.json; echo
          if ! grep -q 'this will be rejected' /tmp/slack-mock/last.json; then
            echo "FAIL: payload text missing"
            exit 1
          fi
          echo "PASS"
