name: Test webhook HTTP error fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local webhook receiver
        run: |
          rm -rf /tmp/webhook
          WEBHOOK_DIR=/tmp/webhook WEBHOOK_PORT=18080 nohup node "$GITHUB_WORKSPACE/tests/fixtures/webhook-server.js" > /tmp/webhook-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/ >/dev/null; then echo "server ready"; exit 0; fi
            sleep 1
          done
          cat /tmp/webhook-server.log
          echo "FAIL: webhook server did not start"
          exit 1
      - id: action
        uses: .
        continue-on-error: true
        env:
          INCOMING_WEBHOOK_URL: http://127.0.0.1:18080/fail
        with:
          text: Should get a 500
      - name: Assert action failed on HTTP 500
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "response: $RESPONSE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on HTTP 500"
            exit 1
          fi
          if [ -n "$RESPONSE" ]; then
            echo "FAIL: expected no response output"
            exit 1
          fi
          if [ ! -f /tmp/webhook/last.json ]; then
            echo "FAIL: request never reached the server"
            exit 1
          fi
          cat /tmp/webhook/last.json; echo
          node -e '
            const b = JSON.parse(require("fs").readFileSync("/tmp/webhook/last.json","utf8"));
            if (b.text !== "Should get a 500") { console.log("FAIL: unexpected body"); process.exit(1); }
          '
          echo "PASS"
