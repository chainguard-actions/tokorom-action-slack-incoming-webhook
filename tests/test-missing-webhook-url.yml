name: Test missing INCOMING_WEBHOOK_URL fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          text: should not be sent
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "response: $RESPONSE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when INCOMING_WEBHOOK_URL is missing"
            exit 1
          fi
          if [ -n "$RESPONSE" ]; then
            echo "FAIL: response output should be empty"
            exit 1
          fi
          echo "PASS"
